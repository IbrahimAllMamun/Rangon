upstream rangon_api { server api:8000; keepalive 32; }
upstream rangon_web { server web:3000; keepalive 32; }

# ---------------------------------------------------------------------------
# HTTP: ACME challenge + redirect everything else to HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    location /healthz { access_log off; return 200 "ok\n"; }
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ---------------------------------------------------------------------------
# HTTPS
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name ${RANGON_DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${RANGON_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${RANGON_DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Content-Security-Policy is NOT set here. The web app mints a per-request
    # nonce in `apps/web/src/middleware.ts` and sends its own header, so the
    # policy can stay strict (no 'unsafe-inline' for scripts) while the App
    # Router's inline RSC payload still runs. `add_header` APPENDS rather than
    # replaces, and a browser enforces the intersection of every policy it
    # receives, so adding one here would silently re-break hydration — the
    # blank production page recorded as D16 in docs/roadmap.md.

    location /healthz { access_log off; return 200 "ok\n"; }

    # --- Next.js owns part of /api/ -----------------------------------------
    # `/api/proxy/*` attaches the httpOnly token to browser calls (ADR-0005) and
    # `/api/auth/*` sets those cookies at login. They are route handlers in the
    # web app, NOT Django. Sending them to the API returns 404 and every
    # interactive feature dies — cart, checkout, POS sales, admin actions, login
    # — while the pages still render, so it looks like the app is simply broken.
    # Longest-prefix wins in nginx, so these override the /api/ rule below.
    location /api/proxy/ {
        proxy_pass http://rangon_web;
        proxy_read_timeout 60s;
    }

    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://rangon_web;
    }

    # --- Django API ---------------------------------------------------------
    location /api/ {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://rangon_api;
        proxy_read_timeout 60s;
    }

    location ~ ^/api/v1/auth/(login|register|password) {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://rangon_api;
    }

    location /django-admin/ {
        # Restrict to the office network before go-live.
        # allow 203.0.113.0/24; deny all;
        proxy_pass http://rangon_api;
    }

    # Uploaded product photography. Django owns these bytes (USE_S3=0 keeps them
    # on the API's disk); the app returns them as origin-relative paths, so they
    # must be routed here rather than falling through to Next.
    location /media/ {
        proxy_pass http://rangon_api;
        expires 7d;
        access_log off;
    }

    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # --- Web app -----------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://rangon_web;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location / {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://rangon_web;
        proxy_read_timeout 30s;
    }
}
