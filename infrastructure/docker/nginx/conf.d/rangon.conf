upstream rangon_api { server api:8000; keepalive 32; }
upstream rangon_web { server web:3000; keepalive 32; }

# ---------------------------------------------------------------------------
# HTTP: ACME challenge + redirect everything else to HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    location /healthz { access_log off; return 200 "ok\n"; }
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ---------------------------------------------------------------------------
# HTTPS
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name ${RANGON_DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${RANGON_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${RANGON_DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;
    # 'unsafe-inline' for styles is required by Next.js's inlined critical CSS.
    # WARNING: `script-src 'self'` below renders a BLANK PAGE. The App Router
    # streams its payload through inline <script> tags, which this blocks, so
    # React never hydrates. Verified in a browser against the production build.
    # Fix properly with a per-request nonce from Next middleware; adding
    # 'unsafe-inline' works but discards what the directive is for. See D16 in
    # docs/roadmap.md. Do not deploy this file until one of the two is done.
    add_header Content-Security-Policy   "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /healthz { access_log off; return 200 "ok\n"; }

    # --- Next.js owns part of /api/ -----------------------------------------
    # `/api/proxy/*` attaches the httpOnly token to browser calls (ADR-0005) and
    # `/api/auth/*` sets those cookies at login. They are route handlers in the
    # web app, NOT Django. Sending them to the API returns 404 and every
    # interactive feature dies — cart, checkout, POS sales, admin actions, login
    # — while the pages still render, so it looks like the app is simply broken.
    # Longest-prefix wins in nginx, so these override the /api/ rule below.
    location /api/proxy/ {
        proxy_pass http://rangon_web;
        proxy_read_timeout 60s;
    }

    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://rangon_web;
    }

    # --- Django API ---------------------------------------------------------
    location /api/ {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://rangon_api;
        proxy_read_timeout 60s;
    }

    location ~ ^/api/v1/auth/(login|register|password) {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://rangon_api;
    }

    location /django-admin/ {
        # Restrict to the office network before go-live.
        # allow 203.0.113.0/24; deny all;
        proxy_pass http://rangon_api;
    }

    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # --- Web app -----------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://rangon_web;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location / {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://rangon_web;
        proxy_read_timeout 30s;
    }
}
