# When another proxy sits in front (a Cloudflare tunnel, a Webuzo vhost), the
# browser's scheme is https but ours is http, so $scheme would tell Django the
# request was insecure. With SECURE_SSL_REDIRECT on that is an infinite redirect
# loop. Prefer the upstream proxy's value and fall back to our own.
# Everything arrives through Docker's NAT, so the source IP is the bridge
# gateway whether it came from this laptop, the LAN, or the public tunnel — IP
# rules cannot tell them apart. The Host header can.
map $host $via_public_tunnel {
    default                     0;
    "~\.trycloudflare\.com$"    1;
}

map $http_x_forwarded_proto $client_proto {
    default            $scheme;
    "~^https?$"        $http_x_forwarded_proto;
}

# Local production routing — one origin, exactly like the deployed topology,
# minus TLS.
#
# This mirrors conf.d/rangon.conf but is a separate file on purpose:
#   * no `${RANGON_DOMAIN}` — nginx does not expand environment variables in
#     config files, which is why the shipped config cannot start as written
#     (docs/roadmap.md, D15)
#   * no TLS block and no HSTS, because this listens on plain HTTP on localhost.
#     HSTS on localhost would poison every other localhost project in your
#     browser, which is a genuinely annoying thing to undo.
#
# The http{} level — gzip, rate-limit zones, proxy headers, JSON access log —
# comes from the real ../nginx.conf, which is mounted alongside this.

upstream rangon_api { server api:8000; keepalive 32; }
upstream rangon_web { server web:3000; keepalive 32; }

server {
    listen 80;
    server_name localhost;

    location /healthz { access_log off; return 200 "ok\n"; }

    # nginx only inherits proxy_set_header from http{} when the current level
    # declares none. Overriding X-Forwarded-Proto therefore means restating the
    # whole set from nginx.conf, or Host and X-Real-IP would silently vanish.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $client_proto;
    proxy_set_header X-Request-ID      $request_id;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=(), payment=()" always;
    # STOPGAP — 'unsafe-inline' in script-src.
    #
    # The shipped conf.d/rangon.conf uses `script-src 'self'`, and under that
    # header the app renders a BLANK PAGE: the Next.js App Router streams its
    # RSC payload through inline <script>self.__next_f.push(...)</script> tags,
    # every one of which the browser blocks. Verified in a browser here — the
    # console fills with "Executing inline script violates ... 'script-src
    # 'self''" and React never hydrates.
    #
    # 'unsafe-inline' buys a working page at the cost of the protection the
    # directive exists for. The correct fix is a per-request nonce issued from
    # Next middleware, with Next stamping it onto its own scripts, so the header
    # can go back to being strict. Tracked as D16 in docs/roadmap.md.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # --- Next.js owns part of /api/ -----------------------------------------
    #
    # These two prefixes are NOT Django. `/api/proxy/*` is the route handler
    # that attaches the httpOnly access token to browser calls (ADR-0005), and
    # `/api/auth/*` is where login/logout set those cookies. Every interactive
    # thing in the app goes through them: cart, checkout, POS sales, admin
    # actions, signing in.
    #
    # The shipped conf.d/rangon.conf sends all of /api/ to Django, so under it
    # each of those returns 404 and the app looks completely dead while the
    # pages themselves still render. Verified here by clicking "Add to cart" and
    # watching /api/proxy/shop/cart 404. Longest-prefix wins in nginx, so these
    # must simply exist — order in the file does not matter.
    location /api/proxy/ {
        proxy_pass http://rangon_web;
        proxy_read_timeout 60s;
    }

    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://rangon_web;
    }

    # --- Django API ---------------------------------------------------------
    location /api/ {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://rangon_api;
        proxy_read_timeout 60s;
    }

    location ~ ^/api/v1/auth/(login|register|password) {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://rangon_api;
    }

    location /django-admin/ {
        # Reachable from this laptop and the LAN, never from the public tunnel.
        # The Django admin is the last thing that should face the world.
        if ($via_public_tunnel) { return 403; }
        proxy_pass http://rangon_api;
    }

    # WhiteNoise serves these from the API image (hashed + precompressed).
    location /static/ {
        proxy_pass http://rangon_api;
        expires 30d;
        access_log off;
    }

    # --- Web app -----------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://rangon_web;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location / {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://rangon_web;
        proxy_read_timeout 30s;
    }
}
