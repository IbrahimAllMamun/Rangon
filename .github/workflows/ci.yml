name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # --------------------------------------------------------------- backend --
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rangon_test
          POSTGRES_USER: rangon
          POSTGRES_PASSWORD: rangon_test_password
        options: >-
          --health-cmd "pg_isready -U rangon" --health-interval 5s
          --health-timeout 5s --health-retries 20
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
        ports: ["6379:6379"]

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-key
      DATABASE_URL: postgresql://rangon:rangon_test_password@localhost:5432/rangon_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_TASK_ALWAYS_EAGER: "1"

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements/*.txt

      - run: pip install -r requirements/dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Missing migrations?
        run: python manage.py makemigrations --check --dry-run

      - name: Type check
        run: mypy .

      - name: Tests (incl. concurrency)
        run: pytest --cov=. --cov-report=term-missing --cov-report=xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: apps/api/coverage.xml

  # -------------------------------------------------------------- frontend --
  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_SITE_URL: http://localhost:4000

  # -------------------------------------------------------------- api-nest --
  # The NestJS port (ADR-0013): its own checks, then the proof that it answers
  # as the Django API does.
  api-nest:
    name: NestJS API (lint, types, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api-nest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/api-nest/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Type check (API and parity harness)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # Both APIs on one freshly migrated and seeded database; every parity case to
  # both. A difference not listed in parity/known-differences.ts fails the job,
  # so a change to either API that breaks the other's answer cannot merge.
  api-nest-parity:
    name: NestJS API parity with Django
    runs-on: ubuntu-latest
    needs: [api-nest]
    steps:
      - uses: actions/checkout@v4

      - name: Start both APIs, migrate, seed, apply the parity fixtures
        run: bash scripts/nest-parity.sh reset

      - name: Compare every case
        run: bash scripts/nest-parity.sh run

      # What production runs since the cutover (ADR-0017): the NestJS API
      # queuing its jobs in PostgreSQL. Every case again, against that; then the
      # worker itself on what the API queues (ADR-0016).
      - name: Compare every case again, with the jobs in pg-boss; then the worker
        run: bash scripts/nest-parity.sh run-jobs

      - name: Compare the rate limits (both APIs throttled)
        run: docker compose -p rangon-nest -f docker-compose.nest.yml --profile throttle run --rm throttle-check

      - name: Logs on failure
        if: failure()
        run: docker compose -p rangon-nest -f docker-compose.nest.yml --profile jobs --profile worker logs --tail 200 django nest nest-jobs nest-worker

  # The comparison a third time, with both APIs' uploads in an S3 server
  # instead of on disk (`USE_S3=1`, ADR-0018): every case, and for every write
  # the object each API stored -- its name, bytes, type and encoding. A job of
  # its own, beside the one above: it needs its own database, seeded through
  # the bucket, and nothing waits for it.
  api-nest-parity-s3:
    name: NestJS API parity with Django, uploads in S3
    runs-on: ubuntu-latest
    needs: [api-nest]
    env:
      PARITY_S3: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Start both APIs and the S3 server, migrate, seed, apply the parity fixtures
        run: bash scripts/nest-parity.sh reset

      - name: Compare every case, and every stored object
        run: bash scripts/nest-parity.sh run

      - name: Logs on failure
        if: failure()
        run: docker compose -p rangon-nest -f docker-compose.nest.yml --profile s3 logs --tail 200 django nest s3

  # ------------------------------------------------------------------- e2e --
  # The four critical flows, driven in a real browser against a real API and a
  # real database (docs/testing/strategy.md).
  #
  # Runs against a **production build** as of 2026-09-21: `next build`, then the
  # standalone `server.js` the image itself runs. It drove `next dev` until then
  # because two specs failed against a real build -- D41, a race in the spec,
  # and D40 ([docs/roadmap.md](../../docs/roadmap.md)) -- and a knowingly-red
  # job helps nobody. Both are dealt with, so the suite now exercises the
  # artefact that ships. See the steps below for the three things that build
  # needs which `next dev` does not.
  #
  # The suite consumes seeded fixtures -- the returns spec approves the one
  # seeded REQUESTED return -- so it is repeatable only once against a given
  # database (D18). That is exactly what this job does: "Migrate and seed"
  # leaves it pristine, the storefront starts after that, and the suite runs
  # once. `E2E_SEED_CMD` would reseed *underneath* the running server, which is
  # a different and worse problem -- see the note on "Run the suite".
  #
  # Twice since the cutover (ADR-0017): against the NestJS API, which is what
  # production runs, and against Django, which is what it goes back to. The
  # Django leg keeps the name this job always had. In both, Django migrates
  # and seeds -- it owns the schema.
  e2e:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: django
            name: E2E (Playwright, four critical flows)
          - api: nest
            name: E2E on the NestJS API (Playwright, four critical flows)

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rangon
          POSTGRES_USER: rangon
          POSTGRES_PASSWORD: rangon_ci_password
        options: >-
          --health-cmd "pg_isready -U rangon" --health-interval 5s
          --health-timeout 5s --health-retries 20
        ports: ["5432:5432"]
      redis:
        # Not optional: the auth throttle is Redis-backed, so without it
        # POST /auth/login/ answers 500 and every signed-in spec fails on a
        # login page that says only "An unexpected error occurred".
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
        ports: ["6379:6379"]

    env:
      DJANGO_SECRET_KEY: ci-only-key
      DATABASE_URL: postgresql://rangon:rangon_ci_password@localhost:5432/rangon
      REDIS_URL: redis://localhost:6379/0
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "*"
      REVALIDATE_SECRET: ci-revalidate-secret
      # Every request in this job -- the storefront's own server-side fetches
      # included -- comes from 127.0.0.1, so the production `anon: 60/min` is a
      # budget for the whole suite rather than for one shopper. With it in place
      # the suite runs close enough to the limit that which storefront spec
      # collects the 429 depends on how long the admin specs happened to take.
      # Nothing here asserts throttling; the limits that are part of a view's
      # security declare their own scope and are unaffected by this.
      DJANGO_THROTTLE_ANON: 10000/min
      E2E_BASE_URL: http://127.0.0.1:4000
      # API_INTERNAL_URL is the one that matters for server-side fetches; it
      # defaults to the compose hostname, which does not resolve here.
      API_INTERNAL_URL: http://127.0.0.1:8000/api/v1
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:4000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements/*.txt

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install the API
        working-directory: apps/api
        run: pip install -r requirements/dev.txt

      - name: Migrate and seed
        working-directory: apps/api
        run: |
          python manage.py migrate --noinput
          python manage.py seed_demo --reset

      - name: Start the API (Django)
        if: matrix.api == 'django'
        working-directory: apps/api
        run: |
          nohup python manage.py runserver 8000 --noreload > /tmp/api.log 2>&1 &
          for _ in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/ || true)
            # 401 is the right answer for an unauthenticated API root.
            if [ "$code" = "401" ] || [ "$code" = "200" ]; then
              echo "API ready ($code)"
              exit 0
            fi
            sleep 2
          done
          echo "API never became ready"
          cat /tmp/api.log
          exit 1

      # The NestJS API as production starts it: the built `dist/main.js`, its
      # jobs in PostgreSQL, worked and scheduled by the same process. It
      # reads uploads from where Django's seed wrote them.
      - name: Start the API (NestJS)
        if: matrix.api == 'nest'
        working-directory: apps/api-nest
        env:
          PORT: "8000"
          RANGON_JOBS_BACKEND: pgboss
          MEDIA_ROOT: ${{ github.workspace }}/apps/api/media
        run: |
          npm ci --no-audit --no-fund
          npm run build
          nohup node dist/main.js > /tmp/api.log 2>&1 &
          for _ in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/ready/ || true)
            if [ "$code" = "200" ]; then
              echo "API ready"
              exit 0
            fi
            sleep 2
          done
          echo "API never became ready"
          cat /tmp/api.log
          exit 1

      - name: Install the web app
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        working-directory: apps/web
        run: |
          # `--with-deps` runs `apt-get update` over every source the runner
          # image ships, and one of them is Google's Chrome repository. We
          # install Playwright's own Chromium build and never Google Chrome,
          # so that source contributes nothing here and can break the step
          # from outside the repository: on 2026-09-09 it served a
          # Packages.gz whose hash did not match its own Release file, and
          # apt failed the whole update before a single spec ran.
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          npx playwright install --with-deps chromium

      # The suite drives the artefact that ships, not `next dev`. It used to
      # run against the dev server because two specs failed against a
      # production build (D40 and D41); D41 was a race in the spec, fixed
      # 2026-09-09, and D40 was worked around 2026-09-21, after which a
      # production build ran 42/42. A production-only defect has reached `main`
      # before -- D74 made `/login` and `/checkout` inert in a production build
      # while `tsc`, lint, the backend suite and this job were all green -- and
      # `next dev` can never see that class of fault.
      #
      # `NEXT_PUBLIC_*` are inlined at build time, so they have to be present
      # here rather than only when the server starts; both come from the job's
      # `env` block above.
      - name: Build the storefront
        working-directory: apps/web
        run: npx next build

      - name: Start the storefront
        working-directory: apps/web
        run: |
          # `next.config.ts` sets `output: "standalone"`, and `next start`
          # refuses to serve that build -- the image runs `server.js` directly,
          # so this does too. The standalone output carries the server and its
          # node_modules but not `.next/static` or `public`, which Next expects
          # to be copied in beside it (the Dockerfile does the same).
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

          # `server.js` binds `process.env.HOSTNAME`, and a runner sets that to
          # its own hostname, so without this the server listens somewhere
          # 127.0.0.1 never reaches and every spec times out on a healthy
          # process. Same one-line trap as the production image (environment.md
          # section 11).
          cd .next/standalone
          HOSTNAME=0.0.0.0 PORT=4000 nohup node server.js > /tmp/web.log 2>&1 &

          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4000/ || true)
            if [ "$code" = "200" ]; then
              echo "Storefront ready (production build)"
              exit 0
            fi
            sleep 2
          done
          echo "Storefront never became ready"
          cat /tmp/web.log
          exit 1

      # Deliberately no `E2E_SEED_CMD` here. That variable makes the suite
      # reseed itself at start-up, which is what a developer wants when they
      # run it twice on one database -- but `seed_demo --reset` rebuilds the
      # catalogue with new UUIDs, and a production server started beforehand
      # goes on serving a product page carrying the *old* variant ids. Adding
      # one to the cart is then refused with 400 ("That product is not
      # available"), the drawer never opens, and the checkout specs fail about
      # half the time. `next dev` never showed this because it does not hold
      # that cache.
      #
      # The database is already pristine: "Migrate and seed" above runs the
      # same `seed_demo --reset` a few steps earlier, and it runs *before* the
      # storefront starts, which is the ordering that matters. This job runs
      # the suite exactly once against a fresh container, so the repeatability
      # that `E2E_SEED_CMD` buys is not needed here.
      - name: Run the suite
        working-directory: apps/web
        run: npx playwright test

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.api }}
          path: apps/web/playwright-report
          retention-days: 7

  # -------------------------------------------------------------- security --
  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Python dependency audit
        working-directory: apps/api
        run: |
          pip install pip-audit
          pip-audit -r requirements/base.txt --strict || \
            echo "::warning::pip-audit found advisories — review before release"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Node dependency audit
        working-directory: apps/web
        run: npm audit --audit-level=high || echo "::warning::npm audit found advisories"

      - name: Node dependency audit (NestJS API)
        working-directory: apps/api-nest
        run: npm audit --omit=dev --audit-level=high || echo "::warning::npm audit found advisories in apps/api-nest"

  # --------------------------------------------------------------- secrets --
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Every commit, not only the tip: a key committed and deleted in the
          # next commit is still in the history anyone who can clone reads.
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: "8.21.2"
          GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check --strict
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks version

      # Blocking, unlike the audits above: a finding fails the build. A false
      # positive is accepted by adding its fingerprint to .gitleaksignore with
      # the reason; a real secret is rotated first, then removed from history
      # (docs/operations/security.md, "Secret scanning").
      - name: Scan the whole history
        run: ./gitleaks git --redact --no-banner --exit-code 1 .

  # ---------------------------------------------------------------- images --
  images:
    name: Build & scan images
    runs-on: ubuntu-latest
    needs: [backend, frontend, api-nest]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Immutable tags only: `latest` is never what production references.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          tags: rangon-api:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          tags: rangon-web:${{ github.sha }}
          load: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.example.com/api/v1
            NEXT_PUBLIC_SITE_URL=https://example.com
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # What production serves since the cutover (ADR-0017).
      - name: Build NestJS API image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api-nest
          file: ./apps/api-nest/Dockerfile
          tags: rangon-api-nest:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=api-nest
          cache-to: type=gha,mode=max,scope=api-nest

      - name: Scan NestJS API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rangon-api-nest:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rangon-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rangon-web:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
