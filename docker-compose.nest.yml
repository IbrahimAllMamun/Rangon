# The NestJS API beside the Django one, on one database -- for building it and
# for proving it answers the same (docs/architecture/decisions/0013-nestjs-api-alongside-django.md).
#
#   docker compose -p rangon-nest -f docker-compose.nest.yml up -d --build
#   docker compose -p rangon-nest -f docker-compose.nest.yml run --rm django python manage.py seed_demo --reset
#   docker compose -p rangon-nest -f docker-compose.nest.yml run --rm parity
#
# **Always pass `-p rangon-nest`.** `.env` sets `COMPOSE_PROJECT_NAME=rangon`,
# and that beats the `name:` below -- without `-p` these containers become
# `rangon-db-1` and friends, inside the *development* project, where the next
# dev `up` treats them as its own.
#
# Its own compose project, database and ports, so it cannot touch the dev,
# test or local-production stacks. Django owns the schema: `django` migrates on
# start, and the Nest API only ever reads the tables Django created.
#
# Ports are bound to 127.0.0.1 and chosen clear of every other stack here:
#   8610  Django (gunicorn, current source mounted)
#   8620  NestJS
#   8630  NestJS queuing its jobs in pg-boss (profile `jobs`, ADR-0016)

name: rangon-nest

x-django-env: &django-env
  DJANGO_SETTINGS_MODULE: config.settings.parity
  DJANGO_SECRET_KEY: nest-parity-not-a-secret
  DJANGO_DEBUG: "0"
  DATABASE_URL: postgresql://rangon:rangon_nest_password@db:5432/rangon
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  # Requests queue their jobs for real, into the broker, where no worker takes
  # them: the harness reads what each API queued and compares the two
  # (checkout's email, SMS and low-stock jobs). `scripts/nest-parity.sh seed`
  # turns this back on, so seeding still runs its jobs inline.
  CELERY_TASK_ALWAYS_EAGER: "0"
  # Mail goes to the sink, which keeps it for the harness to compare with what
  # the Nest API's jobs send (apps/api-nest/parity/sink.ts).
  EMAIL_HOST: sink
  EMAIL_PORT: "1025"
  # Off a live environment only these numbers are texted; everyone else is
  # recorded as suppressed. The parity fixtures' customers, both spellings.
  SMS_ALLOWLIST: "01711000001, 8801911000801"
  RANGON_ALLOW_OVERSELL: "0"
  # The product feed needs an origin to make links absolute.
  RANGON_PUBLIC_URL: https://shop.parity.test
  # Set, so a navigation or category change queues its revalidation job on
  # both sides for the harness to compare. No worker calls it; a job the
  # harness runs on demand reaches the sink.
  WEB_REVALIDATE_URL: http://sink:8025/api/revalidate
  WEB_REVALIDATE_SECRET: parity-revalidate-secret

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rangon
      POSTGRES_USER: rangon
      POSTGRES_PASSWORD: rangon_nest_password
    volumes:
      - nest_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rangon -d rangon"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Where both APIs' background jobs send their mail and their storefront
  # revalidations, kept for the harness (apps/api-nest/parity/sink.ts).
  sink:
    image: rangon-api-nest:parity
    build:
      context: ./apps/api-nest
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./apps/api-nest/parity:/app/parity:ro
    command: ["node", "parity/sink.ts"]
    # The image's own healthcheck asks for the API, which this is not.
    healthcheck:
      disable: true

  django:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    environment:
      <<: *django-env
      # The stand-in payment gateway `config.settings.parity` installs.
      PYTHONPATH: /app:/opt/parity-gateway
    volumes:
      - ./apps/api:/app
      - ./apps/api-nest/parity/gateway:/opt/parity-gateway:ro
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      sink: {condition: service_started}
    # A list, not a folded `>` block: YAML keeps the newlines of more-indented
    # lines in a folded scalar, and the shell then ran gunicorn without its
    # worker flags -- one sync worker, which made every benchmark unfair.
    # Same shape as production: 2 workers x 4 threads (apps/api/Dockerfile).
    command:
      - sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        exec gunicorn config.wsgi:application --bind 0.0.0.0:8000
        --workers 2 --threads 4 --timeout 60 --access-logfile -
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health/"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:8610:8000"

  nest:
    # Named, because the harness runs in it too: it already carries pg and
    # ioredis, which a fresh checkout's apps/api-nest has no node_modules for.
    image: rangon-api-nest:parity
    build:
      context: ./apps/api-nest
      dockerfile: Dockerfile
    environment:
      # One settings module name drives both APIs' profiles (src/config/env.ts).
      DJANGO_SETTINGS_MODULE: config.settings.parity
      DJANGO_SECRET_KEY: nest-parity-not-a-secret
      DATABASE_URL: postgresql://rangon:rangon_nest_password@db:5432/rangon
      REDIS_URL: redis://redis:6379/0
      # Django's broker: jobs this API queues are for Django's worker.
      CELERY_BROKER_URL: redis://redis:6379/1
      RANGON_PUBLIC_URL: https://shop.parity.test
      WEB_REVALIDATE_URL: http://sink:8025/api/revalidate
      WEB_REVALIDATE_SECRET: parity-revalidate-secret
      EMAIL_HOST: sink
      EMAIL_PORT: "1025"
      SMS_ALLOWLIST: "01711000001, 8801911000801"
      MEDIA_ROOT: /media
      PORT: "3000"
    # The image's own app, plus the stand-in payment gateway the Django side
    # installs too (parity/serve.ts). The image's command runs without it.
    # Uploads go where Django's go: one media directory for both processes.
    volumes:
      - ./apps/api-nest/parity:/app/parity:ro
      - ./apps/api/media:/media
    command: ["node", "parity/serve.ts"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      # Django migrates on start; the Nest API reads what that created.
      django: {condition: service_started}
    ports:
      - "127.0.0.1:8620:3000"

  # The same requests to both APIs; every difference printed (apps/api-nest/parity/).
  parity:
    image: rangon-api-nest:parity
    profiles: [parity]
    working_dir: /app
    volumes:
      - ./apps/api-nest/parity:/app/parity:ro
    environment:
      DJANGO_BASE: http://django:8000
      NEST_BASE: http://nest:3000
      DATABASE_URL: postgresql://rangon:rangon_nest_password@db:5432/rangon
      REDIS_URL: redis://redis:6379/0
      # Where both APIs queue Celery jobs; the harness reads and empties it.
      CELERY_BROKER_URL: redis://redis:6379/1
      DJANGO_SECRET_KEY: nest-parity-not-a-secret
      PARITY_SINK: http://sink:8025
      PARITY_ONLY: ${PARITY_ONLY:-}
    command: ["node", "parity/run.ts"]
    depends_on:
      django: {condition: service_healthy}
      nest: {condition: service_healthy}

  # The Nest API as it will run after the cutover: its jobs queued in
  # PostgreSQL by pg-boss, in the transaction that decides them (ADR-0016).
  # No worker here, as Django has none: what each API queued stays put for the
  # harness to read -- Celery's messages on one side, pg-boss's rows on the other.
  nest-jobs:
    profiles: [jobs]
    image: rangon-api-nest:parity
    build:
      context: ./apps/api-nest
      dockerfile: Dockerfile
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.parity
      DJANGO_SECRET_KEY: nest-parity-not-a-secret
      DATABASE_URL: postgresql://rangon:rangon_nest_password@db:5432/rangon
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      RANGON_JOBS_BACKEND: pgboss
      RANGON_JOBS_WORKER: "0"
      RANGON_PUBLIC_URL: https://shop.parity.test
      WEB_REVALIDATE_URL: http://sink:8025/api/revalidate
      WEB_REVALIDATE_SECRET: parity-revalidate-secret
      EMAIL_HOST: sink
      EMAIL_PORT: "1025"
      SMS_ALLOWLIST: "01711000001, 8801911000801"
      MEDIA_ROOT: /media
      PORT: "3000"
    volumes:
      - ./apps/api-nest/parity:/app/parity:ro
      - ./apps/api/media:/media
    command: ["node", "parity/serve.ts"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      django: {condition: service_started}
    ports:
      - "127.0.0.1:8630:3000"

  # The worker alone (src/worker.ts): no listener, the queues only. Started by
  # `run-jobs` once the comparison is over -- during it a queued job must stay
  # queued, to be read. The schedule is off: the sweep would cancel the
  # fixtures' unpaid orders every five minutes.
  nest-worker:
    profiles: [worker]
    image: rangon-api-nest:parity
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.parity
      DJANGO_SECRET_KEY: nest-parity-not-a-secret
      DATABASE_URL: postgresql://rangon:rangon_nest_password@db:5432/rangon
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      RANGON_JOBS_BACKEND: pgboss
      RANGON_JOBS_WORKER: "1"
      RANGON_JOBS_SCHEDULE: ${PARITY_WORKER_SCHEDULE:-0}
      RANGON_PUBLIC_URL: https://shop.parity.test
      WEB_REVALIDATE_URL: http://sink:8025/api/revalidate
      WEB_REVALIDATE_SECRET: parity-revalidate-secret
      EMAIL_HOST: sink
      EMAIL_PORT: "1025"
      SMS_ALLOWLIST: "01711000001, 8801911000801"
      MEDIA_ROOT: /media
    volumes:
      - ./apps/api/media:/media
    command: ["node", "dist/worker.js"]
    # The image's own healthcheck asks for the API, which this is not.
    healthcheck:
      disable: true
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      sink: {condition: service_started}

  # The whole comparison again, with the Nest side queuing in pg-boss.
  parity-jobs:
    image: rangon-api-nest:parity
    profiles: [jobs]
    working_dir: /app
    volumes:
      - ./apps/api-nest/parity:/app/parity:ro
    environment:
      DJANGO_BASE: http://django:8000
      NEST_BASE: http://nest-jobs:3000
      # Where the Nest side's jobs are read from: `pgboss.job`, not the broker.
      PARITY_NEST_JOBS: pgboss
      DATABASE_URL: postgresql://rangon:rangon_nest_password@db:5432/rangon
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      DJANGO_SECRET_KEY: nest-parity-not-a-secret
      PARITY_SINK: http://sink:8025
      PARITY_ONLY: ${PARITY_ONLY:-}
    command: ["node", "parity/run.ts"]
    depends_on:
      django: {condition: service_healthy}
      nest-jobs: {condition: service_healthy}

  # Both APIs with their rate limits on (dev settings), for parity/throttle.ts.
  django-throttled:
    profiles: [throttle]
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    environment:
      <<: *django-env
      DJANGO_SETTINGS_MODULE: config.settings.dev
    volumes:
      - ./apps/api:/app
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: >
      gunicorn config.wsgi:application --bind 0.0.0.0:8000
      --workers 2 --threads 4 --timeout 60
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health/"]
      interval: 5s
      timeout: 3s
      retries: 30

  nest-throttled:
    profiles: [throttle]
    image: rangon-api-nest:parity
    build:
      context: ./apps/api-nest
      dockerfile: Dockerfile
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: nest-parity-not-a-secret
      DATABASE_URL: postgresql://rangon:rangon_nest_password@db:5432/rangon
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      PORT: "3000"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  throttle-check:
    image: rangon-api-nest:parity
    profiles: [throttle]
    working_dir: /app
    volumes:
      - ./apps/api-nest/parity:/app/parity:ro
    environment:
      DJANGO_BASE: http://django-throttled:8000
      NEST_BASE: http://nest-throttled:3000
      DATABASE_URL: postgresql://rangon:rangon_nest_password@db:5432/rangon
      REDIS_URL: redis://redis:6379/0
      DJANGO_SECRET_KEY: nest-parity-not-a-secret
    command: ["node", "parity/throttle.ts"]
    # Healthy, not merely started: the first request must not race the boot.
    depends_on:
      django-throttled: {condition: service_healthy}
      nest-throttled: {condition: service_healthy}

volumes:
  nest_postgres:
