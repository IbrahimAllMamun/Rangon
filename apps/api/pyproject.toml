[project]
name = "rangon-api"
version = "1.0.0"
description = "Rangon Fashion retail platform API"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["*/migrations/*", ".venv", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "DJ", "S", "T20", "RUF"]
ignore = [
    "S101",   # assert is fine in tests
    "N818",   # our exception names are domain terms, not *Error suffixed
    "B008",   # DRF/Django idioms use calls in defaults
    "RUF012", # Django class attrs are mutable by design
    "RUF001", # '–' and '৳' are deliberate: this is a Bangladeshi retail product
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311", "T201", "E501"]
# Demo/seed data uses random for variety, never for anything security-related.
"*/management/commands/*" = ["T201", "S311", "S105", "BLE001"]
"config/settings/*" = ["F403", "F405", "S105"]

[tool.ruff.lint.isort]
known-first-party = [
    "accounts", "catalog", "config", "core", "customers", "engagement",
    "inventory", "notifications", "orders", "promotions", "purchasing",
    "reports", "shipping",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
addopts = "--strict-markers --disable-warnings -ra"
markers = [
    "slow: concurrency and performance tests (real threads, real PostgreSQL)",
    "concurrency: races that must not be allowed to happen",
]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
exclude = ["migrations", "tests"]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.coverage.run]
source = ["."]
omit = ["*/migrations/*", "*/tests/*", "config/*", "manage.py"]
