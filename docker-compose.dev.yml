# Development overlay: source mounts, autoreload, published ports, dev extras.
# docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# The API (apps/api-nest) in watch mode, on http://localhost:8000. Its jobs are
# queued and worked in PostgreSQL by the same process; there is no Celery.
#
# The database starts empty. The demo shop is the committed snapshot,
# restored (README, "Quick start"); a shop with nothing in it is the API's
# own commands (docs/operations/operator-commands.md).

services:
  db:
    ports: ["5432:5432"]          # published for local psql/GUI only

  redis:
    ports: ["6379:6379"]

  # The API: the working copy mounted over the image's, compiled and
  # restarted on every save.
  api-nest:
    # A tag of its own: the base file's is `:latest`, the production image's
    # name (D8 in docs/roadmap.md).
    image: rangon-api-nest:dev
    build:
      target: dev
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_DEBUG: "1"
    volumes:
      - ./apps/api-nest:/app
      # The image's node_modules, not the working copy's: a Linux build, and
      # it outlives a rebuild exactly as the web app's does
      # (.claude/environment.md §7). The compiled output stays in the
      # container as well.
      - /app/node_modules
      - /app/dist
      - api_media:/app/media
    # Inside, 3000, as in production; outside, the port the web app's
    # NEXT_PUBLIC_API_URL names.
    ports: ["8000:3000"]

  web:
    image: rangon-web:dev
    build:
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "dev"]
    environment:
      NODE_ENV: development
      # Not from .env: an older one names Django's `http://api:8000`, which
      # is gone.
      API_INTERNAL_URL: http://api-nest:3000/api/v1
    volumes:
      - ./apps/web:/app
      - /app/node_modules            # keep the image's node_modules
      - /app/.next
    # Host port is configurable: Windows reserves wide TCP ranges (check with
    # `netsh interface ipv4 show excludedportrange protocol=tcp`) and 3000 often
    # falls inside one, which fails with "socket ... forbidden by its access
    # permissions". Set WEB_PORT in .env to move it.
    ports: ["${WEB_PORT:-3000}:3000"]
    networks: [frontend, backend]

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"                  # web UI
    networks: [backend]
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-rangon_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-rangon_minio_password}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [backend]
    restart: unless-stopped

volumes:
  api_media:
  minio_data:
