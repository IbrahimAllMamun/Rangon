# Production overlay.
#   TAG=<git-sha> docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Rules enforced here:
#   * images are pulled by immutable tag, never built on the host
#   * db/redis publish no ports and stay on the private network
#   * nothing runs as root where the base image allows otherwise
#   * migrations are a separate release step, not a start hook:
#     `run --rm api-nest node dist/cli.js migrate`, then `sync-permissions`
#
# The API, `api-nest`, answers every request, works the background jobs and
# fires the schedule. docs/operations/deployment.md has the procedures.

services:
  db:
    # A containerised database is acceptable only with durable, backed-up
    # storage.  A managed instance is preferred — if you use one, delete this
    # service and point DATABASE_URL at it.
    volumes:
      - ${POSTGRES_DATA_PATH:-/var/lib/rangon/postgres}:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
    deploy:
      resources:
        limits: {memory: 2G}

  redis:
    volumes:
      - ${REDIS_DATA_PATH:-/var/lib/rangon/redis}:/data

  api-nest:
    image: ${REGISTRY:-ghcr.io/ibrahimallmamun}/rangon-api-nest:${TAG:?set TAG to the git sha}
    build: !reset null
    environment:
      # The settings module's name picks the profile: `prod` is HTTPS
      # redirects, strict hosts and no debug output (src/config/env.ts).
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_DEBUG: "0"
      # One proxy in front of the API -- the nginx below, which is the only
      # service that publishes a port, so nothing reaches the API around it.
      # Without this the rate limits key on the whole client-supplied
      # `X-Forwarded-For` and a caller varying one header is never throttled.
      # Put a CDN or load balancer in front of nginx and this becomes 2.
      DJANGO_TRUSTED_PROXY_HOPS: ${DJANGO_TRUSTED_PROXY_HOPS:-1}
      # The image's own tag, unless told otherwise: an error reported to Sentry
      # names the release it came from (ADR-0019).
      RANGON_RELEASE: ${RANGON_RELEASE:-${TAG}}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # One replica is one Node process: the API, the job worker and the
    # schedule (ADR-0016). A second replica is safe -- pg-boss hands a job, and
    # a scheduled run, to one worker -- and is what to raise first.
    deploy:
      replicas: 1
      resources:
        limits: {memory: 1G}

  web:
    image: ${REGISTRY:-ghcr.io/ibrahimallmamun}/rangon-web:${TAG:?set TAG to the git sha}
    build: !reset null
    environment:
      # Server-side calls go straight to the API on the private network, not
      # through nginx.
      API_INTERNAL_URL: http://api-nest:3000/api/v1
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      replicas: 2

  nginx:
    image: nginx:1.27-alpine
    depends_on: [api-nest, web]
    environment:
      # Where `/api/` and `/media/` go.
      RANGON_API_UPSTREAM: api-nest:3000
      # Substituted into default.conf.template. No default: a blank server_name
      # would match nothing and the certificate path would not exist, which is
      # a worse failure than refusing to start.
      RANGON_DOMAIN: ${RANGON_DOMAIN:?set RANGON_DOMAIN to the public hostname}
      # Restrict substitution to our own names so nginx's runtime variables
      # ($host, $scheme, ...) survive whatever else is in the environment.
      NGINX_ENVSUBST_FILTER: RANGON_
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Templates, not conf.d: the image renders these with envsubst at start
      # and writes the result into conf.d, which must stay writable. See the
      # header of default.conf.template.
      - ./infrastructure/docker/nginx/templates:/etc/nginx/templates:ro
      - ${TLS_CERT_PATH:-/etc/letsencrypt}:/etc/letsencrypt:ro
    networks: [frontend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

