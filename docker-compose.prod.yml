# Production overlay.
#   TAG=<git-sha> docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Rules enforced here:
#   * images are pulled by immutable tag, never built on the host
#   * db/redis publish no ports and stay on the private network
#   * nothing runs as root where the base image allows otherwise
#   * migrations are a separate `run --rm api ... migrate` step, not a start hook

services:
  db:
    # A containerised database is acceptable only with durable, backed-up
    # storage.  A managed instance is preferred — if you use one, delete this
    # service and point DATABASE_URL at it.
    volumes:
      - ${POSTGRES_DATA_PATH:-/var/lib/rangon/postgres}:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
    deploy:
      resources:
        limits: {memory: 2G}

  redis:
    volumes:
      - ${REDIS_DATA_PATH:-/var/lib/rangon/redis}:/data

  api:
    image: ${REGISTRY:-ghcr.io/rangon}/rangon-api:${TAG:?set TAG to the git sha}
    build: !reset null
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_DEBUG: "0"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - api_logs:/app/logs
    deploy:
      replicas: 2
      resources:
        limits: {memory: 1G}

  worker:
    image: ${REGISTRY:-ghcr.io/rangon}/rangon-api:${TAG:?set TAG to the git sha}
    build: !reset null
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      replicas: 2

  beat:
    image: ${REGISTRY:-ghcr.io/rangon}/rangon-api:${TAG:?set TAG to the git sha}
    build: !reset null
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      replicas: 1        # never raise this

  web:
    image: ${REGISTRY:-ghcr.io/rangon}/rangon-web:${TAG:?set TAG to the git sha}
    build: !reset null
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      replicas: 2

  nginx:
    image: nginx:1.27-alpine
    depends_on: [api, web]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ${TLS_CERT_PATH:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - api_static:/var/www/static:ro
    networks: [frontend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  api_logs:
  api_static:
