# Self-contained test environment.  This is what CI runs.
#   docker compose -f docker-compose.test.yml run --rm api-test
# It shares nothing with the development stack: own project name, own volumes,
# no published ports, tmpfs database for speed.

name: rangon-test

services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rangon_test
      POSTGRES_USER: rangon
      POSTGRES_PASSWORD: rangon_test_password
    tmpfs:
      - /var/lib/postgresql/data       # ephemeral: tests must never persist
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off",
              "-c", "full_page_writes=off", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rangon -d rangon_test"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-test:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-test:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: test-only-key
      DJANGO_DEBUG: "0"
      DATABASE_URL: postgresql://rangon:rangon_test_password@db-test:5432/rangon_test
      REDIS_URL: redis://redis-test:6379/0
      CELERY_BROKER_URL: redis://redis-test:6379/1
      CELERY_RESULT_BACKEND: redis://redis-test:6379/2
      CELERY_TASK_ALWAYS_EAGER: "1"
      RANGON_ALLOW_OVERSELL: "0"
    volumes:
      - ./apps/api:/app
    depends_on:
      db-test: {condition: service_healthy}
      redis-test: {condition: service_healthy}
    command: ["pytest", "-p", "no:cacheprovider", "--maxfail=1", "-q"]

  web-test:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: test
      NEXT_PUBLIC_API_URL: http://api-test:8000/api/v1
      API_INTERNAL_URL: http://api-test:8000/api/v1
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    command: ["npm", "run", "test"]
